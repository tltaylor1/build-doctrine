# This repository holds itself to the bar it sets for others. The same gates it
# tells a project to run, it runs on its own documents and components. Actions
# are pinned to commit hashes, with the release each came from in a comment.
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Writing rules (Vale)
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a  # v2.1.2
        with:
          fail_on_error: true
          version: 3.17.0

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history so the scan covers every commit
      # gitleaks is invoked directly rather than through its action. The action
      # scans the commit range from the push event, which is an incremental
      # scan, not the full history this job claims to cover, and the range is
      # invalid whenever history is rewritten. The binary is pinned by version
      # and verified against the project's published checksum before it runs.
      - name: Secret scan over full history (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.sums \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz\$" gitleaks.sums \
            | sed "s/gitleaks_.*_linux_x64.tar.gz/gitleaks.tar.gz/" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

