repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks secret scan
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      # Vale enforces the writing rules at commit time, so a violation never
      # reaches history. It needs Vale installed on the machine; CI runs it too,
      # which catches anyone who committed without the hook.
      - id: vale
        name: vale writing rules
        entry: vale
        language: system
        types: [markdown]
      # The coverage mapping decays the moment a rule is renamed or a
      # row is dropped, and a decayed mapping claims coverage nobody
      # can trace.
      - id: coverage
        name: framework coverage check
        entry: python3 scripts/check_coverage.py
        language: system
        pass_filenames: false
      # The enforcement tables claim a mechanism for every blocking rule.
      # This holds them to it, so a row edited in one place and not the
      # other fails at the commit that separates them rather than at an
      # audit months later.
      - id: mechanisms
        name: enforcement mechanism check
        entry: python3 scripts/check_mechanisms.py
        language: system
        pass_filenames: false
      # The writing rules apply to commit messages, which Vale never
      # reads; a message is public prose the moment it is pushed.
      - id: commit-message-writing
        name: commit message writing rules
        entry: bash scripts/check_commit_message.sh
        language: system
        stages: [commit-msg]
