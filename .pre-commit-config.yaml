repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks secret scan
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      # Vale enforces the writing rules at commit time, so a violation never
      # reaches history. It needs Vale installed on the machine; CI runs it too,
      # which catches anyone who committed without the hook.
      - id: vale
        name: vale writing rules
        entry: vale
        language: system
        types: [markdown]
      # The writing rules apply to commit messages, which Vale never
      # reads; a message is public prose the moment it is pushed.
      - id: commit-message-writing
        name: commit message writing rules
        entry: bash scripts/check_commit_message.sh
        language: system
        stages: [commit-msg]
